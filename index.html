<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <script>
    'use strict'
    ;(() => {
      const stored = localStorage.getItem('theme')
      const prefersDark = window.matchMedia(
        '(prefers-color-scheme: dark)'
      ).matches
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark')
      }
    })()
    </script>
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Mateus Santana | Desenvolvedor de Software</title>

    <meta
      content="Portfólio de Mateus Santana, desenvolvedor de software com foco em Front-end e atuação em aplicações web, mobile e back-end com React, TypeScript e Node.js."
      name="description"
    >
  </head>

  <body class="antialiased">
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
